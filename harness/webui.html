<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trio Test Runner</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#656d76;--card:#f6f8fa;--line:#d0d7de;--accent:#0969da;--ok:#1a7f37;--bad:#cf222e;--warn:#9a6700;--input:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e6edf3;--muted:#8d96a0;--card:#161b22;--line:#30363d;--accent:#4493f8;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--input:#0d1117}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#8d96a0;--card:#161b22;--line:#30363d;--accent:#4493f8;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--input:#0d1117}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* e.g. #applogs is display:flex, which would otherwise override hidden */
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}
header h1{font-size:17px;margin:0} header a{color:inherit;text-decoration:none} header span{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;padding:16px;max-width:1500px;margin:0 auto}
/* phone column = the phone screen scaled to --phone-h, plus the panel's 10px padding and border: no side gaps */
.layout{--ar:828/1792;--phone-h:min(72vh,820px)}
.layout.with-phone{grid-template-columns:340px minmax(0,1fr) calc(var(--phone-h) * var(--ar) + 22px);max-width:none}
@media (max-width:1300px){.layout.with-phone{grid-template-columns:340px minmax(0,1fr)} #phone{grid-column:1}}
@media (max-width:900px){.layout,.layout.with-phone{grid-template-columns:1fr} #phone{grid-column:auto}}
#phone{align-self:start;position:sticky;top:12px;padding:10px}
.phonehead{display:flex;align-items:center;gap:8px;margin-bottom:6px} .phonehead h2{margin:0}
#screen{aspect-ratio:var(--ar);width:min(100%,calc(var(--phone-h) * var(--ar)));margin:0 auto;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8d96a0;font-size:13px}
#screen.control{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px} .btns button{padding:6px 2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typerow{display:flex;gap:6px;margin-top:8px}
#lastshot img{max-width:120px;border:1px solid var(--line);border-radius:6px;margin-top:8px;display:block}
header .spacer{flex:1}
.layout{--logs-w:560px}
.layout.with-logs{grid-template-columns:340px minmax(0,1fr) var(--logs-w);max-width:none}
.layout.with-logs.with-phone{grid-template-columns:340px minmax(0,1fr) var(--logs-w) calc(var(--phone-h) * var(--ar) + 22px)}
#logsgrip{position:absolute;left:-12px;top:0;bottom:0;width:10px;cursor:col-resize;border-radius:4px}
#logsgrip:hover,#logsgrip.dragging{background:var(--accent);opacity:.35}
body.resizing{cursor:col-resize;user-select:none}
@media (max-width:1500px){.layout.with-logs.with-phone{grid-template-columns:340px minmax(0,1fr) calc(var(--phone-h) * var(--ar) + 22px)} .layout.with-logs.with-phone #applogs{grid-column:1 / -1;position:static;height:60vh} .layout.with-logs.with-phone #logsgrip{display:none}}
@media (max-width:1100px){.layout.with-logs{grid-template-columns:340px minmax(0,1fr)} #applogs{grid-column:1 / -1;position:static;height:60vh} #logsgrip{display:none}}
@media (max-width:900px){.layout.with-logs,.layout.with-logs.with-phone{grid-template-columns:1fr}}
#applogs{align-self:start;position:sticky;top:12px;padding:10px;display:flex;flex-direction:column;gap:8px;height:calc(100vh - 90px);min-width:0}
#applogs .logbox{flex:1;min-height:0;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}
#applogs pre{font-size:11px}
button.linkish{border:0;background:none;padding:0;font-size:13px;color:var(--muted);text-align:left}
#tandembox.open{flex:1;display:flex;flex-direction:column;min-height:0} #tandembox.open .logbox{margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
h2{font-size:15px;margin:0 0 10px} h3{font-size:14px;margin:0 0 8px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
label.check{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:13px;margin:8px 0}
input[type=text],input[type=number],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--fg);font:inherit}
textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{flex:1;margin:0;text-align:center;padding:6px;cursor:pointer;color:var(--fg);font-size:13px}
.seg input{display:none} .seg label:has(input:checked){background:var(--accent);color:#fff}
fieldset{border:0;padding:0;margin:0} fieldset:disabled{opacity:.45}
details.more{margin-top:10px} details.more summary{cursor:pointer;font-size:13px;color:var(--muted)}
button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button.primary{background:var(--ok);border-color:transparent;color:#fff;font-weight:600}
button.danger{color:var(--bad)} button:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.err{color:var(--bad);font-size:13px;white-space:pre-wrap}
.hint{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse} td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500} tr.job{cursor:pointer} tr.job:hover td{background:var(--card)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:var(--muted);white-space:nowrap}
.pill.passed,.pill.posted,.pill.works{background:var(--ok)} .pill.failed,.pill.broken,.pill.cancelled,.pill.interrupted{background:var(--bad)}
.pill.running,.pill.posting{background:var(--accent)} .pill.partial,.pill.waiting,.pill.inconclusive,.pill.unknown{background:var(--warn)}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.stage{border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px;background:var(--bg)}
.stage.skipped{opacity:.6} .stage.passed{border-color:var(--ok)} .stage.failed{border-color:var(--bad)} .stage.running{border-color:var(--accent)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:13px;margin:8px 0}
.facts dt{color:var(--muted)} .facts dd{margin:0;word-break:break-word}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.log{max-height:420px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
iframe{width:100%;height:80vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.stack>*+*{margin-top:16px}
#form{align-self:start}
.muted{color:var(--muted)} a{color:var(--accent)}
.findings{white-space:pre-wrap;font-size:13px}
ul.examples{color:var(--muted);font-size:12px;margin:4px 0 0;padding-left:18px} ul.examples li{margin:1px 0}
button.small{padding:2px 9px;font-size:12px;margin-top:8px;display:block}
.section{margin:16px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.addrow{display:flex;gap:6px;align-items:center} .addrow button{padding:4px 9px}
.pill.live{background:var(--accent)} .pill.starting{background:var(--warn)} .pill.created,.pill.sent{background:var(--ok)}
.cont{display:grid;grid-template-columns:1fr 1fr;gap:14px} @media (max-width:1100px){.cont{grid-template-columns:1fr}}
.cont>div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg)} .cont h4{margin:0 0 4px;font-size:13px}
.controw{border-top:1px solid var(--line);padding:8px 0;font-size:13px} .controw:first-child{border-top:0}
.controw code{font-size:12px;word-break:break-all}
</style>
</head>
<body>
<header><h1><a href="#/">Trio Test Runner</a></h1><span class="spacer"></span><button id="logstoggle" type="button">Show Trio logs</button><button id="phonetoggle" type="button" hidden>Live phone</button></header>
<div class="layout">
  <form id="form" class="card" autocomplete="off">
    <h2>New run</h2>
    <label>App</label>
    <div class="seg">
      <label><input type="radio" name="app" value="trio" checked>Trio</label>
      <label><input type="radio" name="app" value="loop">Loop</label>
    </div>
    <label>Target</label>
    <div class="seg">
      <label><input type="radio" name="target" value="rooted-vnc" checked>rooted-vnc (iPhone)</label>
      <label><input type="radio" name="target" value="simulator">simulator</label>
    </div>
    <label for="trio" id="triolabel">Trio PR or branch</label>
    <input type="text" id="trio" name="trio">
    <ul class="examples"><li><code>branch-name</code></li><li><code>upstream:branch-name</code></li><li><code>jwoglom/Trio@branch-name</code></li><li>GitHub link</li></ul>
    <div class="adds" id="adds-cherry_pick"></div>
    <button type="button" class="small" data-add="cherry_pick" data-label="Trio cherry-pick">Add cherry-pick</button>
    <div class="adds" id="adds-submodule_override"></div>
    <button type="button" class="small" data-add="submodule_override" data-label="Submodule override">Add submodule override</button>
    <div class="adds" id="adds-submodule_cherry_pick"></div>
    <button type="button" class="small" data-add="submodule_cherry_pick" data-label="Submodule cherry-pick">Add submodule cherry-pick</button>
    <label class="check"><input type="checkbox" name="skip_onboarding" checked>Skip onboarding</label>
    <label class="check"><input type="checkbox" name="cgm_sim" checked><span id="cgmlabel">Use Glucose Simulator</span></label>
    <label class="check"><input type="checkbox" name="pump_sim" checked>Use Pump Simulator</label>
    <fieldset id="pumpfields">
      <div class="row">
        <div><label for="pump">Pump (simulator)</label>
          <select id="pump" name="pump" title="faketandem: a Tandem Mobi emulator; TandemKit is built on its virtual pump (Debug only)">
            <option value="simulator" selected>Pump Simulator</option><option value="faketandem">Tandem on faketandem</option></select></div>
        <div><label for="pump_setup">Tandem setup</label>
          <select id="pump_setup" name="pump_setup" title="preseed: the app starts with the pump paired. walk: the agent adds and pairs it in the app">
            <option value="preseed" selected>already paired</option><option value="walk">agent walks the setup</option></select></div>
      </div>
      <div class="row">
        <div><label for="pump_scenario">Pump history</label>
          <input type="text" id="pump_scenario" name="pump_scenario" list="pump_scenarios" placeholder="none"
                 title="pump use replayed before the app connects: history, IOB, last bolus, a running temp basal">
          <datalist id="pump_scenarios"><option value="recent-doses"><option value="scheduled-basal"></datalist></div>
        <div><label for="faketandem_ref">faketandem ref</label>
          <input type="text" id="faketandem_ref" name="faketandem_ref" placeholder="main"></div>
      </div>
    </fieldset>
    <fieldset id="devfields">
      <label for="devices">Devices (simulator)</label>
      <select id="devices" name="devices" title="phone + watch: the app's Watch app on a watch simulator paired with the phone. auto: a small model decides from the app's and submodules' PRs whether the watch is needed">
        <option value="phone" selected>phone only</option><option value="phone+watch">phone + watch</option>
        <option value="auto">auto (a model decides from the PRs)</option></select>
    </fieldset>
    <div class="section">
    <label class="check" style="margin-top:0"><input type="checkbox" name="agent" checked>Trigger agent</label>
    <datalist id="models"><option value="sonnet"><option value="opus"><option value="haiku"></datalist>
    <fieldset id="agentfields">
      <div class="row">
        <div><label for="claude_model">Claude model</label>
          <input type="text" id="claude_model" name="claude_model" value="sonnet" list="models"></div>
        <div><label for="agent_minutes">Time limit (min)</label>
          <input type="number" id="agent_minutes" name="agent_minutes" value="30" min="1" max="180"></div>
      </div>
      <label for="agent_instructions">Extra focus for the agent</label>
      <textarea id="agent_instructions" name="agent_instructions" placeholder="e.g. check the bolus sheet"></textarea>
    </fieldset>
    </div>
    <label class="check"><input type="checkbox" name="post_comment">Post the PR comment when done</label>
    <div class="row">
      <div><label for="configuration">Configuration</label>
        <select id="configuration" name="configuration"><option>Debug</option><option>Release</option></select></div>
      <div><label for="xcode">Xcode</label><select id="xcode" name="xcode"><option value="">harness.env / newest</option></select></div>
    </div>
    <details class="more" id="simbox"><summary>Simulator</summary>
      <fieldset id="simfields">
        <label for="sim_device">Device</label>
        <input type="text" id="sim_device" name="sim_device" list="sim_devices">
        <datalist id="sim_devices"></datalist>
        <label for="sim_runtime">Runtime</label>
        <input type="text" id="sim_runtime" name="sim_runtime" list="sim_runtimes" placeholder="newest installed">
        <datalist id="sim_runtimes"></datalist>
        <label for="watch_model">Watch model</label>
        <input type="text" id="watch_model" name="watch_model" list="watch_models">
        <datalist id="watch_models"></datalist>
      </fieldset>
    </details>
    <div class="actions"><button class="primary" type="submit">Run</button><span class="err" id="formerr"></span></div>
  </form>
  <main id="main" class="stack"></main>
  <aside id="applogs" class="card" hidden>
    <div id="logsgrip" title="Drag to resize; double-click to reset"></div>
    <div class="phonehead"><h2 id="logstitle">Trio logs</h2><span id="logstate" class="hint"></span><span class="spacer" style="flex:1"></span>
      <input type="text" id="logfilter" placeholder="filter" title="Only lines containing this (case-insensitive)" style="width:160px;padding:3px 7px">
      <label class="check" style="margin:0"><input type="checkbox" id="logfollow" checked>follow</label>
      <button id="logsclose" type="button" title="Hide the log pane">×</button></div>
    <div class="logbox"><pre id="log-trio"></pre></div>
    <div id="tandembox"><button type="button" id="tandemtoggle" class="linkish">▸ Tandem logs</button>
      <div class="logbox" hidden><pre id="log-tandem"></pre></div></div>
  </aside>
  <aside id="phone" class="card" hidden>
    <div class="phonehead"><h2>iPhone</h2><span id="vncstate" class="hint">not connected</span><span class="spacer" style="flex:1"></span>
      <button id="vncconnect" type="button">Connect</button><button id="phoneclose" type="button" title="Hide the phone panel">×</button></div>
    <label class="check" title="Clicks tap, drags swipe, keys type, right-click is Home"><input type="checkbox" id="vnccontrol">Control iPhone</label>
    <div class="hint" id="busyhint" hidden>An agent is currently controlling the phone</div>
    <div id="screen">Connect to see the phone over TrollVNC.</div>
    <div class="btns">
      <button type="button" data-act="shot" title="Native-resolution screenshot; added to the open run if it is finished">Screenshot</button>
      <button type="button" data-act="home">Home</button>
      <button type="button" data-act="lock" title="Press the power button">Power / lock</button>
      <button type="button" data-act="unlock" title="Wake, swipe up, enter the passcode from .env">Unlock</button>
      <button type="button" data-act="wake" title="Power + swipe up if the screen is dark">Wake</button>
      <button type="button" data-act="launch" id="launchbtn" title="Open the app over SSH">Launch Trio</button>
    </div>
    <div class="typerow"><input type="text" id="typetext" placeholder="Type into the focused field"><button type="button" id="typebtn">Type</button></div>
    <div id="devmsg" class="hint" style="margin-top:6px"></div>
    <a id="lastshot" target="_blank" rel="noopener" hidden><img alt="last screenshot"></a>
  </aside>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const ANSI = /\x1b\[[0-9;?]*[A-Za-z]/g;
const ACTIVE = new Set(["queued", "waiting", "running"]);
const STAGES = [["e2e", "checkout → build → install → launch → smoke"], ["agent", "agent"], ["highlights", "review"]];
const E2E_STEPS = ["checkout", "build", "install", "launch", "smoke", "report"];
// the trio-test-e2e stage as its own steps: done, the one running (or that failed), and not reached
function e2eChips(j) {
  const st = j.stages?.e2e?.status, seen = j.e2e_steps || [];
  if (!st) return `<span class="stage">${E2E_STEPS.join(" → ")}</span>`;
  const last = seen[seen.length - 1];
  return E2E_STEPS.map(s => {
    let cls = "";
    if (seen.includes(s)) cls = s !== last ? "passed" : st === "running" ? "running" : st === "failed" ? "failed" : "passed";
    else if (st !== "running") cls = "skipped";
    return `<span class="stage ${cls}">${esc(s)}${cls === "running" ? " · running" : cls === "failed" ? " · failed" : ""}</span>`;
  }).join("");
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({error: `HTTP ${r.status}`}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}
const store = {get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} }};
const pill = s => s ? `<span class="pill ${esc(s)}">${esc(s)}</span>` : "";
const what = i => [i.trio || (!i.submodules && "dev") || "", i.submodules, i.cherry_pick && `🍒 ${i.cherry_pick}`,
  i.submodule_cherry_pick && `🍒 ${i.submodule_cherry_pick}`].filter(Boolean).join(" + ");
const when = t => t ? t.replace("T", " ").slice(5, 16) : "";

// ---- form ----
const form = $("#form");
function syncTarget() {
  const sim = form.target.value === "simulator";
  $("#simfields").disabled = !sim;
  $("#devfields").disabled = !sim;
  $("#pumpfields").disabled = !sim;
  if (sim) $("#simbox").open = true;
  $("#phonetoggle").hidden = sim;
}
function syncAgent() {
  const on = form.agent.checked;
  $("#agentfields").disabled = !on;
}
form.addEventListener("change", e => { if (e.target.name === "target") syncTarget(); if (e.target.name === "agent") syncAgent(); });
syncTarget();
syncAgent();
api("/api/options").then(o => {
  for (const x of o.xcodes) $("#xcode").insertAdjacentHTML("beforeend", `<option value="${esc(x)}">${esc(x.split("/").pop().replace(/\.app$/, ""))}</option>`);
  if (o.defaults.xcode && o.xcodes.includes(o.defaults.xcode)) $("#xcode").value = o.defaults.xcode;
  $("#sim_devices").innerHTML = o.sim_devices.map(d => `<option value="${esc(d)}">`).join("");
  $("#sim_runtimes").innerHTML = o.sim_runtimes.map(d => `<option value="${esc(d)}">`).join("");
  $("#sim_device").placeholder = o.defaults.sim_device || "iPhone 16";
  $("#watch_models").innerHTML = (o.watch_models || []).map(d => `<option value="${esc(d)}">`).join("");
  $("#watch_model").placeholder = o.defaults.watch_model || "Apple Watch Series 11 (46mm)";
}).catch(() => {});
// "Add cherry-pick" / "Add submodule override": one field per item, each with its own label and a remove button
let addSeq = 0;
for (const b of form.querySelectorAll("button[data-add]")) b.onclick = () => {
  const id = `add${++addSeq}`, box = $(`#adds-${b.dataset.add}`);
  box.insertAdjacentHTML("beforeend", `<div class="added"><label for="${id}">${esc(b.dataset.label)}</label>
    <div class="addrow"><input type="text" id="${id}" data-multi="${esc(b.dataset.add)}"><button type="button" title="Remove">×</button></div></div>`);
  const row = box.lastElementChild;
  row.querySelector("button").onclick = () => row.remove();
  $(`#${id}`).focus();
};
const multi = name => [...form.querySelectorAll(`[data-multi="${name}"]`)].map(i => i.value.trim()).filter(Boolean);

form.addEventListener("submit", async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(form));
  f.cherry_pick = multi("cherry_pick").join(" ");
  f.submodule_cherry_pick = multi("submodule_cherry_pick").join(" ");
  f.submodules = multi("submodule_override").join(" ");
  for (const k of ["skip_onboarding", "cgm_sim", "pump_sim", "post_comment", "agent"]) f[k] = form[k].checked;
  $("#formerr").textContent = "";
  try {
    const job = await api("/api/jobs", f);
    location.hash = `#/job/${job.id}`;
  } catch (err) { $("#formerr").textContent = err.message; }
});

// ---- views ----
let timer = null, view = null;
function route() {
  clearTimeout(timer);
  const m = location.hash.match(/^#\/job\/([\w-]+)/);
  view = m ? {job: m[1], offset: 0, follow: true} : {list: true};
  $("#main").innerHTML = "";
  m ? showJob() : showList();
}
window.addEventListener("hashchange", route);

async function showList() {
  const v = view;
  try {
    const {jobs} = await api("/api/state");
    if (v !== view) return;
    $("#main").innerHTML = `<section class="card"><h2>Runs</h2>${jobs.length ? `<table><thead><tr><th>Started</th><th>Target</th><th>Trio / submodules</th><th>Status</th><th>Comment</th></tr></thead><tbody>${

    }</tbody></table>` : `<p class="muted">No runs yet. Fill in the form and press Run.</p>`}</section>`;

async function showJob() {

  try { j = await api(`/api/jobs/${v.job}`); } catch (err) { $("#main").innerHTML = `<p class="err">${esc(err.message)}</p>`; return; }
  if (v !== view) return;
  if (!$("#jobhead")) {
    $("#main").innerHTML = `
      <section class="card" id="jobhead"></section>
      <section class="card" id="comment"></section>
      <section class="card" id="findings" hidden><h3>Agent findings</h3><div class="findings"></div></section>

        <div class="log"><pre id="log"></pre></div></section>`;
    $("#follow").onchange = e => v.follow = e.target.checked;

  }
  renderHead(j);

  }
  try {
    const l = await api(`/api/jobs/${v.job}/log?offset=${v.offset}`);
    if (v !== view) return;
    const pre = $("#log");
    if (l.skipped) pre.textContent += `\n… ${l.skipped} bytes not shown …\n`;
    pre.textContent += l.text.replace(ANSI, "");
    // a full xcodebuild log is several MB: keep the page responsive with the last ~2 MB (all of it is in log.txt)
    if (pre.textContent.length > 2e6) pre.textContent = "… earlier lines trimmed (full log: runs/.webui/" + v.job + "/log.txt) …\n" + pre.textContent.slice(-1.5e6);
    v.offset = l.offset;
    if (v.follow && l.text) pre.parentElement.scrollTop = pre.parentElement.scrollHeight;
  } catch (_) {}
  const busy = ACTIVE.has(j.status) || j.comment?.status === "posting" || (j.continuations || []).some(c => c.status === "starting");
  if (v === view) timer = setTimeout(showJob, busy ? 2000 : 10000);
}

async function copyLog(id) {
  const msg = t => { $("#copymsg").textContent = t; setTimeout(() => { if ($("#copymsg")) $("#copymsg").textContent = ""; }, 3000); };
  try {
    const r = await fetch(`/api/jobs/${id}/log.txt`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const text = (await r.text()).replace(ANSI, "");
    try { await navigator.clipboard.writeText(text); }
    catch (_) {   // plain HTTP from another machine: no async clipboard API
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      if (!ok) throw new Error("the browser refused");
    }
    msg(`copied ${Math.round(text.length / 1024)} KB`);
  } catch (err) { msg(`copy failed: ${err.message}`); }
}

// ---- continue: the agent's own conversation with full access, or a cloud session (harness/handoff.py) ----
const KINDS = {local: "Conversation on this Mac", cloud: "Cloud session", followup: "Sent to the PR's session"};
function renderContinue(j) {
  const ctl = $("#contctl"), ready = !ACTIVE.has(j.status) && j.run_name;
  $("#continue").hidden = !ready;            // nothing to continue until the run has finished
  const key = `${ready}|${!!j.agent_session}|${j.pr_session}`;
  if (ctl.dataset.key !== key) {
    ctl.dataset.key = key;
    ctl.innerHTML = !ready ? "" : `<div class="cont">
      <div><h4>Continue on this Mac</h4>
        <p class="hint" style="margin:0 0 6px">${j.agent_session ? "The agent's session" : "A new session with this run's details (no agent ran)"} with full access: edit, commit, push, rebuild, re-test. Opens at claude.ai/code; runs until stopped.</p>
        <label class="check"><input type="checkbox" id="contcopy" checked>Make repo copy</label>
        <div class="hint">Worktree at the tested commits and branches, so other runs can use the shared checkout.</div>
        <label for="contmode">Permission mode</label>
        <select id="contmode"><option value="auto" selected>auto: a classifier approves safe actions</option><option value="acceptEdits">acceptEdits: edits go ahead, commands ask</option><option value="default">default: ask for edits and commands</option><option value="plan">plan: read-only until you approve a plan</option></select>
        <div class="actions"><button class="primary" id="contlocal">${j.agent_session ? "Continue conversation" : "Start session"}</button></div></div>
      <div><h4>Claude Code on the web</h4>
        <p class="hint" style="margin:0 0 6px">New cloud session on the PR's branch, given the findings and tested commits. No transcript, screenshots or iOS builds.</p>
        <div class="actions"><button id="contcloud">Start cloud session</button></div>
        ${j.pr_session ? `<p class="hint" style="margin:10px 0 4px">Session that wrote the PR: <a href="${esc(j.pr_session)}" target="_blank" rel="noopener">${esc(j.pr_session.replace("https://", ""))}</a></p>
        <div class="actions" style="margin-top:4px"><button id="contfollow">Send findings to that session</button></div>` : ""}</div></div>`;
    const go = async (btn, body, ask) => {
      if (ask && !confirm(ask)) return;
      btn.disabled = true;
      try { await api(`/api/jobs/${j.id}/continue`, body); clearTimeout(timer); showJob(); }
      catch (err) { alert(err.message); }
      btn.disabled = false;
    };
    const b1 = $("#contlocal"), b2 = $("#contcloud"), b3 = $("#contfollow");
    if (b1) b1.onclick = () => go(b1, {kind: "local", copy: $("#contcopy").checked, permission_mode: $("#contmode").value},
      "Start a Claude Code session on this Mac, outside the sandbox, that can edit, commit and push as you?");
    if (b2) b2.onclick = () => go(b2, {kind: "cloud"}, "Create a Claude Code cloud session on the PR's branch with these findings?");
    if (b3) b3.onclick = () => go(b3, {kind: "followup"}, `Send the findings as a message to ${j.pr_session}?`);
  }
  const list = j.continuations || [];
  const html = list.slice().reverse().map(c => {
    const link = c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">Open in claude.ai ↗</a>` : "";
    const facts = [];
    if (c.step && c.status === "starting") facts.push(esc(c.step) + "…");
    if (c.workdir) facts.push(`folder <code>${esc(c.workdir)}</code>${c.copy ? (c.copy_removed ? " (copy removed)" : " (worktree copy)") : " (shared checkout)"}`);
    for (const r of c.repos || []) if (r.local) facts.push(`${esc(r.name)}: branch <code>${esc(r.local)}</code> → <code>${esc(r.remote)}/${esc(r.branch)}</code>${r.note ? ` <span class="hint">${esc(r.note)}</span>` : ""}`);
    if (c.repo) facts.push(`repo <code>${esc(c.repo)}</code> branch <code>${esc(c.branch)}</code>`);
    if (c.terminal && c.status !== "live") facts.push(`in a terminal: <code>${esc(c.terminal)}</code>`);
    const live = c.kind === "local" && (c.status === "live" || c.status === "starting");
    const btns = [live ? `<button class="danger" data-stop="${esc(c.id)}">Stop</button>` : "",
      c.kind === "local" && c.copy && c.workdir && !c.copy_removed && !live ? `<button data-rmcopy="${esc(c.id)}">Remove copy</button>` : ""].join("");
    return `<div class="controw"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(KINDS[c.kind] || c.kind)}</b>${pill(c.status)}
      <span class="hint">${esc(when(c.created))}</span>${link}<span style="flex:1"></span>${btns}</div>
      ${facts.map(f => `<div>${f}</div>`).join("")}${c.error ? `<pre class="err">${esc(c.error)}</pre>` : ""}</div>`;
  }).join("");
  const box = $("#contlist");
  if (box.dataset.html !== html) {
    box.dataset.html = html;
    box.innerHTML = html ? `<div style="margin-top:12px">${html}</div>` : "";
    for (const b of box.querySelectorAll("[data-stop]")) b.onclick = async () => {
      if (!confirm("Stop this session? Its conversation is kept; you can resume it in a terminal.")) return;
      try { await api(`/api/jobs/${j.id}/continue/${b.dataset.stop}/stop`, {}); showJob(); } catch (err) { alert(err.message); }
    };
    for (const b of box.querySelectorAll("[data-rmcopy]")) b.onclick = async () => {
      if (!confirm("Remove the worktree copy? Refused if anything is uncommitted; local branches (and their commits) are kept.")) return;
      try { await api(`/api/jobs/${j.id}/continue/${b.dataset.rmcopy}/remove-copy`, {}); showJob(); } catch (err) { alert(err.message); }
    };
  }
}

// the app the form is set to: names, the log pane and Launch follow it

function setLogsWidth(px) {

{

// each stream keeps its raw text; the filter box shows only the lines containing its text (case-insensitive)
function renderLog(which, scroll) {
  const s = logStreams[which], pre = $(`#log-${which}`), box = pre.parentElement;
  const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const f = $("#logfilter").value.trim().toLowerCase();
  const raw = s.raw || "";
  if (!f) pre.textContent = raw;
  else {
    const hits = raw.split("\n").filter(l => l.toLowerCase().includes(f));
    pre.textContent = hits.length ? hits.join("\n") + "\n" : `(no lines containing "${$("#logfilter").value.trim()}")`;
  }
  if (scroll || ($("#logfollow").checked && atEnd)) box.scrollTop = box.scrollHeight;
}
$("#logfilter").oninput = () => { for (const k of Object.keys(logStreams)) renderLog(k, $("#logfollow").checked); };
async function pollOne(which) {
  const s = logStreams[which];
  const r = await api(`/api/applogs?which=${which}&target=${encodeURIComponent(logTarget)}&app=${form.app.value}&off=${s.off ?? ""}`);
  if (r.size === null) { if (!s.raw) { s.raw = "(no log file yet)"; renderLog(which); } return; }
  const first = s.off === null;
  if (first) s.raw = r.offset < r.size || r.size > 64 * 1024 ? "… earlier lines not shown …\n" : "";
  if (r.reset) s.raw += "\n——— new day's log ———\n";
  if (r.text) s.raw += r.text;
  if (s.raw.length > 600000) s.raw = "… earlier lines trimmed …\n" + s.raw.slice(-450000);
  s.off = r.offset;
  if (first || r.text || r.reset) renderLog(which, first && $("#logfollow").checked);
  return r.offset < r.size;                   // more to read right away (a long gap)
}
async function pollLogs() {
  clearTimeout(logTimer);
  if ($("#applogs").hidden) return;
  const t = form.target.value, key = `${t}/${form.app.value}`;
  if (key !== logKey) {                       // target or app switched: start both logs over
    logKey = key; logTarget = t;
    for (const [k, s] of Object.entries(logStreams)) { s.off = null; s.raw = ""; $(`#log-${k}`).textContent = ""; }
  }
  let more = false;
  try {
    if (form.app.value === "loop") {          // Loop writes no text log of its own (harness/applogs.py)
      logStreams.trio.raw = "(Loop writes no app log of its own; TandemKit's is below)"; renderLog("trio");
    } else more = await pollOne("trio");
    if (tandemOpen()) more = (await pollOne("tandem")) || more;
    $("#logstate").textContent = t === "simulator" ? "simulator" : "iPhone";
  } catch (err) { $("#logstate").textContent = err.message.slice(0, 120); }
  logTimer = setTimeout(pollLogs, more ? 200 : 2500);
}

// ---- live phone (rooted-vnc): noVNC through the server's TrollVNC proxy + harness buttons ----
const NOVNC = "https://cdn.jsdelivr.net/npm/@novnc/novnc@1.7.0/core/rfb.js";
let rfb = null;
function setPhone(open) {
  $("#phone").hidden = !open;
  document.querySelector(".layout").classList.toggle("with-phone", open);
  $("#phonetoggle").textContent = open ? "Hide phone" : "Live phone";
  store.set("phone", open ? "1" : "0");
  if (open) { checkBusy(true); if (!rfb) vncConnect(); } else vncDisconnect();
}
$("#phonetoggle").onclick = () => setPhone($("#phone").hidden);
$("#phoneclose").onclick = () => setPhone(false);
const vncState = t => $("#vncstate").textContent = t;
async function vncConnect() {
  $("#vncconnect").textContent = "Disconnect";
  vncState("connecting…");
  let RFB;
  try { ({default: RFB} = await import(NOVNC)); }
  catch (err) { vncState("could not load noVNC (needs internet for cdn.jsdelivr.net)"); $("#vncconnect").textContent = "Connect"; return; }
  $("#screen").textContent = "";
  const r = new RFB($("#screen"), `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/vnc/ws`, {shared: true});
  rfb = r;
  r.scaleViewport = true; r.resizeSession = false; r.focusOnClick = true;
  r.viewOnly = !$("#vnccontrol").checked;
  r.addEventListener("connect", () => vncState("connected"));
  // Fit the box to the phone's framebuffer so noVNC scales it with no bars (size is known after ServerInit).
  const fit = () => { const w = r._fbWidth, h = r._fbHeight; if (w && h) document.querySelector(".layout").style.setProperty("--ar", `${w}/${h}`); };
  r.addEventListener("connect", fit);
  r.addEventListener("desktopname", fit);
  r.addEventListener("disconnect", async e => {
    if (rfb === r) rfb = null;
    $("#vncconnect").textContent = "Connect";
    let why = e.detail.clean ? "disconnected" : "connection lost";
    try { const st = await api("/api/vnc/status"); if (st.last_error) why = st.last_error; } catch (_) {}
    vncState(why);
    if (!rfb) $("#screen").textContent = "Not connected.";
  });
}
function vncDisconnect() { if (rfb) { const r = rfb; rfb = null; r.disconnect(); } }
$("#vncconnect").onclick = () => rfb ? vncDisconnect() : vncConnect();
$("#vnccontrol").onchange = e => { if (rfb) rfb.viewOnly = !e.target.checked; $("#screen").classList.toggle("control", e.target.checked); };
let busyTimer = null;
async function checkBusy(first) {

    $("#busyhint").hidden = !busy;
    if (first) { $("#vnccontrol").checked = !busy; $("#vnccontrol").onchange({target: $("#vnccontrol")}); }
  } catch (_) {}
  busyTimer = setTimeout(checkBusy, 5000);
}
async function device(action, body = {}) {
  const btns = document.querySelectorAll("#phone .btns button, #typebtn");
  btns.forEach(b => b.disabled = true);
  $("#devmsg").textContent = `${action}…`;
  try {
    const job = (location.hash.match(/^#\/job\/([\w-]+)/) || [])[1];
    const res = await api(`/api/device/${action}`, {...body, job, app: form.app.value});
    $("#devmsg").textContent = res.message || "done";
    if (res.url) { $("#lastshot").href = res.url; $("#lastshot img").src = res.url; $("#lastshot").hidden = false; }
    if (action === "shot" && job && view?.job === job) { view.reportShown = null; }
  } catch (err) { $("#devmsg").textContent = err.message; }
  btns.forEach(b => b.disabled = false);
}
for (const b of document.querySelectorAll("#phone .btns button")) b.onclick = () => device(b.dataset.act);
$("#typebtn").onclick = () => { const t = $("#typetext").value; if (t) device("type", {text: t}).then(() => $("#typetext").value = ""); };
$("#typetext").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#typebtn").click(); } };
setApp();
if (store.get("phone") === "1" && form.target.value === "rooted-vnc") setPhone(true);
if (store.get("applogs") === "1") setLogs(true);

route();
</script>
</body>
</html>

# Run trio-test-e2e on the iOS Simulator for a Trio PR or branch, optionally with submodule
# (e.g. TandemKit) PRs or branches, on the self-hosted macOS workers (home-infra/macos-workers).
# Manual only:
#   gh workflow run e2e.yml -R jwoglom/trio-test-harness -f submodules=jwoglom/TandemKit#395 -f post_comment=true
name: Trio e2e (simulator)
run-name: "e2e: ${{ inputs.trio || (!inputs.submodules && 'dev') || '' }}${{ inputs.trio && inputs.submodules && ' + ' || '' }}${{ inputs.submodules }}${{ inputs.agent == 'claude' && ' (agent)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      trio:
        description: "Trio PR or branch (PR link, owner/repo#N, nightscout/Trio PR number, or branch; blank: dev, or the branch that has the submodule)"
        type: string
      submodules:
        description: "Submodules (PR links or branches: PR link, owner/repo#N, or NAME@branch; space-separated)"
        type: string
      configuration:
        description: "Build configuration"
        type: choice
        options: [Debug, Release]
        default: Debug
      skip_onboarding:
        description: "Skip onboarding"
        type: boolean
        default: true
      smoke:
        description: "Configure the Glucose Simulator + Pump Simulator"
        type: boolean
        default: true
      agent:
        description: "Agent (claude: Claude Code then tests what the PR describes)"
        type: choice
        options: [claude, none]
        default: claude
      agent_instructions:
        description: "Extra focus for the agent"
        type: string
      agent_minutes:
        description: "Agent time limit (minutes)"
        type: number
        default: 30
      post_comment:
        description: "Post PR comment"
        type: boolean
        default: false
      sim_device:
        description: "Simulator device"
        type: string
        default: iPhone 17
      sim_runtime:
        description: "Simulator runtime, e.g. iOS 26.3 (blank: newest installed)"
        type: string
      xcode:
        description: "Xcode"
        type: choice
        options: ["26.2"]
        default: "26.2"

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.trio }}-${{ inputs.submodules }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, macOS, worker]
    timeout-minutes: 150
    env:
      # Inputs reach scripts only through env, never interpolated into them.
      IN_TRIO: ${{ inputs.trio }}
      IN_SUBMODULES: ${{ inputs.submodules }}
      IN_CONFIGURATION: ${{ inputs.configuration }}
      IN_SKIP_ONBOARDING: ${{ inputs.skip_onboarding }}
      IN_SMOKE: ${{ inputs.smoke }}
      IN_AGENT_INSTRUCTIONS: ${{ inputs.agent_instructions }}
      TH_XCODE_APP: /Applications/Xcode_${{ inputs.xcode }}.app
      TH_SIM_DEVICE: ${{ inputs.sim_device }}
      TH_SIM_RUNTIME: ${{ inputs.sim_runtime }}
      # jwoglom/Trio carries feat/tandem (the TandemKit submodule) and upstream's branches; the workers'
      # bare mirror of nightscout/Trio serves as a reference, so most objects come from local disk.
      TH_TRIO_ORIGIN: jwoglom/Trio
      TH_TRIO_REFERENCE: /Volumes/work/mirrors/nightscout/Trio.git
      TH_GIT_MIRRORS: /Volumes/work/mirrors
      # Built by home-infra macos-workers (toolchains role), pinned to one WebDriverAgent release.
      TH_WDA_PREBUILT: /Volumes/work/cache/wda/current
    steps:
      - uses: actions/checkout@v4

      # Maps the two source fields onto trio-test-e2e flags (rules in ci/inputs.py) and picks the PR
      # the run is about: the Trio PR, else the first submodule PR.
      - name: Validate inputs
        id: v
        run: python3 ci/inputs.py "$RUNNER_TEMP/e2e-args" >> "$GITHUB_OUTPUT"

      # Contents: read on jwoglom/Trio + jwoglom/TandemKit (private submodule) and PR metadata.
      - name: GitHub App token (jwoglom)
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIO_E2E_APP_ID }}
          private-key: ${{ secrets.TRIO_E2E_APP_KEY }}
          owner: jwoglom

      - name: Python environment
        run: |
          set -euo pipefail
          uv venv --quiet .venv
          uv pip install --quiet --python .venv/bin/python -r requirements.txt

      - name: Build, install, launch, smoke (trio-test-e2e)
        id: e2e
        env:
          TH_GIT_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -uo pipefail
          # Per-job paths (workerd's task dir), so nothing is shared between runs.
          export TRIO_REPO="$RUNNER_TEMP/Trio" TH_DERIVED_DATA="${DERIVED_DATA:-$RUNNER_TEMP/DerivedData}"
          args=(--mode simulator --yes --no-agent --comment never --configuration "$IN_CONFIGURATION"
                --onboarding "$([ "$IN_SKIP_ONBOARDING" = true ] && echo preseed || echo walk)")
          while IFS= read -r a; do args+=("$a"); done < "$RUNNER_TEMP/e2e-args"
          [ "$IN_SMOKE" = true ] || args+=(--no-smoke)
          # The runner's bash has -e; keep going so the run dir is recorded even when the run fails.
          rc=0
          ./trio-test-e2e "${args[@]}" || rc=$?
          run_dir=$(cat runs/.current 2>/dev/null || true)
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          exit $rc

      # No GitHub token here: the agent only drives the simulator through the harness.
      - name: Agent (Claude Code tests what the PR describes)
        id: agent
        if: inputs.agent == 'claude' && steps.e2e.outcome == 'success'
        timeout-minutes: ${{ inputs.agent_minutes }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
        run: |
          set -euo pipefail
          smoke_note=$([ "$IN_SMOKE" = true ] && echo ", with the Glucose Simulator and Pump Simulator configured" || true)
          extra=$([ -n "$IN_AGENT_INSTRUCTIONS" ] && printf '\nFocus from the person who started this run:\n%s\n' "$IN_AGENT_INSTRUCTIONS" || true)
          prompt=$(RUN_DIR="$RUN_DIR" SMOKE="$smoke_note" EXTRA="$extra" .venv/bin/python -c '
          import os, pathlib
          t = pathlib.Path("ci/agent-prompt.md").read_text()
          print(t.format(run_dir=os.environ["RUN_DIR"], smoke_note=os.environ["SMOKE"], extra=os.environ["EXTRA"]))')
          claude -p "$prompt" --output-format text \
            --allowedTools "Bash(./trio-test-harness:*)" "Bash(./bin/th:*)" "Bash(sleep:*)" Read Glob Grep \
            | tee "$RUN_DIR/agent-summary.md"
          ./trio-test-harness report html --run "$RUN_DIR" >/dev/null

      - name: GitHub App token (PR owner)
        id: comment_token
        if: always() && inputs.post_comment && steps.v.outputs.pr != '' && steps.v.outputs.pr_owner != 'jwoglom'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIO_E2E_APP_ID }}
          private-key: ${{ secrets.TRIO_E2E_APP_KEY }}
          owner: ${{ steps.v.outputs.pr_owner }}

      - name: PR comment
        id: comment
        if: always() && inputs.post_comment && steps.e2e.outputs.run_dir != ''
        env:
          GH_TOKEN: ${{ steps.comment_token.outputs.token || (steps.v.outputs.pr_owner == 'jwoglom' && steps.token.outputs.token) || '' }}
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ steps.v.outputs.pr }}
          PR_OWNER: ${{ steps.v.outputs.pr_owner }}
        run: |
          if [ -z "$PR" ]; then
            echo "::notice title=PR comment skipped::this run has no PR (Trio branch only)"
            echo "note=skipped: this run has no PR" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=PR comment skipped::the trio-test-harness-runner App is not installed on $PR_OWNER"
            echo "note=skipped: the trio-test-harness-runner App is not installed on $PR_OWNER" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if out=$(./trio-test-harness report pr "$PR" --run "$RUN_DIR" --artifact-url "$RUN_URL" 2>&1); then
            echo "note=posted $(echo "$out" | tail -1)" >> "$GITHUB_OUTPUT"
          else
            echo "$out" | tail -20
            echo "::warning title=PR comment failed::see the PR comment step log"
            echo "note=failed; see the PR comment step log" >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: always()
        env:
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
          COMMENT_NOTE: ${{ steps.comment.outputs.note }}
        run: |
          args=()
          [ -z "$RUN_DIR" ] || args+=("$RUN_DIR" --agent-summary "$RUN_DIR/agent-summary.md")
          [ -z "$COMMENT_NOTE" ] || args+=(--comment-note "$COMMENT_NOTE")
          python3 ci/summary.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.e2e.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: trio-e2e-${{ github.run_id }}
          path: ${{ steps.e2e.outputs.run_dir }}
          retention-days: 14

      - name: Upload build log (on failure)
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: trio-e2e-${{ github.run_id }}-build-log
          path: build/xcodebuild-*.log
          retention-days: 14
          if-no-files-found: ignore

# Run trio-test-e2e on the iOS Simulator for a Trio or submodule (e.g. TandemKit) PR or branch,
# on the self-hosted macOS workers (home-infra/macos-workers). Manual only:
#   gh workflow run e2e.yml -R jwoglom/trio-test-harness -f pr=jwoglom/TandemKit#395 -f comment=auto
name: Trio e2e (simulator)
run-name: "e2e: ${{ inputs.pr || inputs.branch }} (simulator${{ inputs.agent == 'claude' && ', agent' || '' }})"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Trio or submodule PR: URL, owner/repo#N, or a number (nightscout/Trio)"
        type: string
      branch:
        description: "Trio branch instead of a PR (exactly one of pr/branch)"
        type: string
      trio_branch:
        description: "Trio branch to test a submodule PR against (blank: from .gitmodules)"
        type: string
      submodules:
        description: "Extra submodule overrides, space-separated NAME@REF"
        type: string
      configuration:
        type: choice
        options: [Debug, Release]
        default: Debug
      onboarding:
        description: "preseed skips onboarding; walk taps through it"
        type: choice
        options: [preseed, walk]
        default: preseed
      smoke:
        description: "Configure the Glucose Simulator + Pump Simulator"
        type: boolean
        default: true
      agent:
        description: "claude: Claude Code then tests what the PR describes"
        type: choice
        options: [claude, none]
        default: claude
      agent_instructions:
        description: "Extra focus for the agent"
        type: string
      agent_minutes:
        description: "Time limit for the agent step"
        type: number
        default: 30
      comment:
        description: "auto: post the report as a PR comment (as trio-test-harness-runner[bot])"
        type: choice
        options: [never, auto]
        default: never
      sim_device:
        type: string
        default: iPhone 17
      sim_runtime:
        description: "e.g. iOS 26.3 (blank: newest installed)"
        type: string
      xcode:
        type: choice
        options: ["26.2"]
        default: "26.2"
      runner:
        description: "worker = either VM"
        type: choice
        options: [worker, vm1, vm2]
        default: worker

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.pr || inputs.branch }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, macOS, "${{ inputs.runner }}"]
    timeout-minutes: 150
    env:
      # Inputs reach scripts only through env, never interpolated into them.
      IN_PR: ${{ inputs.pr }}
      IN_BRANCH: ${{ inputs.branch }}
      IN_TRIO_BRANCH: ${{ inputs.trio_branch }}
      IN_SUBMODULES: ${{ inputs.submodules }}
      IN_CONFIGURATION: ${{ inputs.configuration }}
      IN_ONBOARDING: ${{ inputs.onboarding }}
      IN_SMOKE: ${{ inputs.smoke }}
      IN_AGENT_INSTRUCTIONS: ${{ inputs.agent_instructions }}
      TH_XCODE_APP: /Applications/Xcode_${{ inputs.xcode }}.app
      TH_SIM_DEVICE: ${{ inputs.sim_device }}
      TH_SIM_RUNTIME: ${{ inputs.sim_runtime }}
      # The workers keep a bare mirror of nightscout/Trio; cloning with it as a reference takes seconds.
      TH_TRIO_REFERENCE: /Volumes/work/mirrors/nightscout/Trio.git
    steps:
      - name: Validate inputs
        id: v
        run: |
          set -euo pipefail
          if [ -n "$IN_PR" ] && [ -n "$IN_BRANCH" ] || [ -z "$IN_PR$IN_BRANCH" ]; then
            echo "::error::set exactly one of pr or branch"; exit 1
          fi
          owner=jwoglom
          if [ -n "$IN_PR" ]; then
            if [[ "$IN_PR" =~ ^https://github\.com/([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)/pull/([0-9]+)/?$ ]] ||
               [[ "$IN_PR" =~ ^([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)#([0-9]+)$ ]]; then
              owner=${BASH_REMATCH[1]}
            elif [[ "$IN_PR" =~ ^[0-9]+$ ]]; then
              owner=nightscout
            else
              echo "::error::pr must be a PR URL, owner/repo#N, or a number"; exit 1
            fi
          elif ! [[ "$IN_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::branch has unexpected characters"; exit 1
          fi
          [ -z "$IN_TRIO_BRANCH" ] || [[ "$IN_TRIO_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad trio_branch"; exit 1; }
          for s in $IN_SUBMODULES; do
            [[ "$s" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad submodule override: $s"; exit 1; }
          done
          echo "pr_owner=$owner" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # Contents: read on jwoglom/Trio + jwoglom/TandemKit (private submodule) and PR metadata.
      - name: GitHub App token (jwoglom)
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIO_E2E_APP_ID }}
          private-key: ${{ secrets.TRIO_E2E_APP_KEY }}
          owner: jwoglom

      - name: Python environment
        run: |
          set -euo pipefail
          uv venv --quiet .venv
          uv pip install --quiet --python .venv/bin/python -r requirements.txt

      - name: Build, install, launch, smoke (trio-test-e2e)
        id: e2e
        env:
          TH_GIT_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -uo pipefail
          # Per-job paths (workerd's task dir), so nothing is shared between runs.
          export TRIO_REPO="$RUNNER_TEMP/Trio" TH_DERIVED_DATA="${DERIVED_DATA:-$RUNNER_TEMP/DerivedData}"
          args=(--mode simulator --yes --no-agent --comment never
                --configuration "$IN_CONFIGURATION" --onboarding "$IN_ONBOARDING")
          if [ -n "$IN_PR" ]; then args+=(--pr "$IN_PR"); else args+=(--branch "$IN_BRANCH"); fi
          [ -z "$IN_TRIO_BRANCH" ] || args+=(--trio-branch "$IN_TRIO_BRANCH")
          for s in $IN_SUBMODULES; do args+=(--submodule "$s"); done
          [ "$IN_SMOKE" = true ] || args+=(--no-smoke)
          ./trio-test-e2e "${args[@]}"
          rc=$?
          run_dir=$(cat runs/.current 2>/dev/null || true)
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          exit $rc

      # No GitHub token here: the agent only drives the simulator through the harness.
      - name: Agent (Claude Code tests what the PR describes)
        id: agent
        if: inputs.agent == 'claude' && steps.e2e.outcome == 'success'
        timeout-minutes: ${{ inputs.agent_minutes }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
        run: |
          set -euo pipefail
          smoke_note=$([ "$IN_SMOKE" = true ] && echo ", with the Glucose Simulator and Pump Simulator configured" || true)
          extra=$([ -n "$IN_AGENT_INSTRUCTIONS" ] && printf '\nFocus from the person who started this run:\n%s\n' "$IN_AGENT_INSTRUCTIONS" || true)
          prompt=$(RUN_DIR="$RUN_DIR" SMOKE="$smoke_note" EXTRA="$extra" .venv/bin/python -c '
          import os, pathlib
          t = pathlib.Path("ci/agent-prompt.md").read_text()
          print(t.format(run_dir=os.environ["RUN_DIR"], smoke_note=os.environ["SMOKE"], extra=os.environ["EXTRA"]))')
          claude -p "$prompt" --output-format text \
            --allowedTools "Bash(./trio-test-harness:*)" "Bash(./bin/th:*)" "Bash(sleep:*)" Read Glob Grep \
            | tee "$RUN_DIR/agent-summary.md"
          ./trio-test-harness report html --run "$RUN_DIR" >/dev/null

      - name: GitHub App token (PR owner)
        id: comment_token
        if: always() && inputs.comment == 'auto' && inputs.pr != '' && steps.v.outputs.pr_owner != 'jwoglom'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIO_E2E_APP_ID }}
          private-key: ${{ secrets.TRIO_E2E_APP_KEY }}
          owner: ${{ steps.v.outputs.pr_owner }}

      - name: PR comment
        id: comment
        if: always() && inputs.comment == 'auto' && inputs.pr != '' && steps.e2e.outputs.run_dir != ''
        env:
          GH_TOKEN: ${{ steps.comment_token.outputs.token || (steps.v.outputs.pr_owner == 'jwoglom' && steps.token.outputs.token) || '' }}
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_OWNER: ${{ steps.v.outputs.pr_owner }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "note=skipped: the trio-test-harness-runner App is not installed on $PR_OWNER" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if out=$(./trio-test-harness report pr "$IN_PR" --run "$RUN_DIR" --artifact-url "$RUN_URL" 2>&1); then
            echo "note=posted $(echo "$out" | tail -1)" >> "$GITHUB_OUTPUT"
          else
            echo "$out" | tail -20
            echo "note=failed; see the PR comment step log" >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: always()
        env:
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
          COMMENT_NOTE: ${{ steps.comment.outputs.note }}
        run: |
          args=()
          [ -z "$RUN_DIR" ] || args+=("$RUN_DIR" --agent-summary "$RUN_DIR/agent-summary.md")
          [ -z "$COMMENT_NOTE" ] || args+=(--comment-note "$COMMENT_NOTE")
          python3 ci/summary.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.e2e.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: trio-e2e-${{ github.run_id }}
          path: ${{ steps.e2e.outputs.run_dir }}
          retention-days: 14

      - name: Upload build log (on failure)
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: trio-e2e-${{ github.run_id }}-build-log
          path: build/xcodebuild-*.log
          retention-days: 14
          if-no-files-found: ignore

# Run trio-test-e2e on the iOS Simulator for a Trio PR or branch, optionally with submodule
# (e.g. TandemKit) PRs or branches, on the self-hosted macOS workers (home-infra/macos-workers).
# app=loop does the same for Loop, built from LoopKit/LoopWorkspace (`trio-test-e2e --app loop`).
# Manual only:
#   gh workflow run e2e.yml -R jwoglom/trio-test-harness -f submodules=jwoglom/TandemKit#395 -f post_comment=true
#   gh workflow run e2e.yml -R jwoglom/trio-test-harness -f app=loop -f submodules=jwoglom/TandemKit#395
# pump=faketandem runs the app's TandemKit against faketandem, a Tandem Mobi emulator (harness/faketandem.py):
#   gh workflow run e2e.yml -R jwoglom/trio-test-harness -f trio=feat/tandem-closed-beta -f pump=faketandem \
#     -f pump_setup=walk -f pump_scenario=recent-doses
# comment_on_run posts a comment written after an earlier run on the PR this run is about, with that run's
# screenshots, and tests nothing (`trio-test-harness report pr --body`):
#   gh workflow run e2e.yml -R jwoglom/trio-test-harness -f submodules=jwoglom/TandemKit#609 \
#     -f comment_on_run=40232151326 -f comment_body="$(cat comment.md)"
name: Trio e2e (simulator)
run-name: "${{ inputs.comment_on_run && format('comment from e2e run {0}: ', inputs.comment_on_run) || '' }}e2e${{ inputs.app == 'loop' && ' (Loop)' || '' }}: ${{ inputs.trio || (!inputs.submodules && 'dev') || '' }}${{ inputs.trio && inputs.submodules && ' + ' || '' }}${{ inputs.submodules }}${{ inputs.pump == 'faketandem' && format(' (faketandem, {0})', inputs.pump_setup) || '' }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App under test (loop: Loop built from LoopKit/LoopWorkspace)"
        type: choice
        options: [trio, loop]
        default: trio
      trio:
        description: "PR or branch of the app's repo (PR link, owner/repo#N, a nightscout/Trio or LoopKit/LoopWorkspace PR number, or branch; blank: dev, or the branch that has the submodule)"
        type: string
      submodules:
        description: "Submodules (PR links or branches: PR link, owner/repo#N, or NAME@branch; space-separated)"
        type: string
      cherry_pick:
        description: "Cherry-pick onto the app's repo, in order (its PR = its own commits, commit sha, A..B, or branch; space-separated)"
        type: string
      submodule_cherry_pick:
        description: "Cherry-pick onto submodules, in order (submodule PR, NAME@sha, NAME@A..B, NAME@branch; space-separated)"
        type: string
      configuration:
        description: "Build configuration"
        type: choice
        options: [Debug, Release]
        default: Debug
      skip_onboarding:
        description: "Skip onboarding"
        type: boolean
        default: true
      smoke:
        description: "Configure the simulated CGM + Pump Simulator (with pump=faketandem: the simulated CGM)"
        type: boolean
        default: true
      pump:
        description: "Pump: simulator (the app's Pump Simulator) or faketandem (a Tandem Mobi emulator; TandemKit built on its virtual pump; Debug only)"
        type: choice
        options: [simulator, faketandem]
        default: simulator
      pump_setup:
        description: "faketandem: preseed (the app starts with the pump paired) or walk (the agent adds and pairs it in the app)"
        type: choice
        options: [preseed, walk]
        default: preseed
      pump_scenario:
        description: "faketandem: pump use before the app connects (history, IOB, last bolus, temp basal): recent-doses, basal-only, or blank for none"
        type: string
      faketandem_ref:
        description: "faketandem branch, tag or sha (blank: main)"
        type: string
      devices:
        description: "Devices: phone (the iPhone app only), phone+watch (also the app's Watch app on a paired watch simulator), or auto (a small model decides from the app's and submodules' PRs)"
        type: choice
        options: [phone, phone+watch, auto]
        default: phone
      watch_model:
        description: "Watch size when the watch is used (default: TH_WATCH_SIM_DEVICE, Apple Watch Series 11 (46mm))"
        type: choice
        options: [default, 40mm, 41mm, 42mm, 44mm, 45mm, 46mm, 49mm]
        default: default
      claude_model:
        description: "Claude model for the agent (sonnet, opus, haiku, or a model ID)"
        type: string
        default: sonnet
      agent_instructions:
        description: "Extra focus for the agent"
        type: string
      agent_minutes:
        description: "Agent time limit (minutes)"
        type: number
        default: 30
      post_comment:
        description: "Post PR comment"
        type: boolean
        default: false
      comment_on_run:
        description: "Instead of testing: post comment_body on the PR with this earlier run's screenshots"
        type: string
      comment_body:
        description: "With comment_on_run: the comment (markdown); ![caption](./screenshots/NNN.png) shows a screenshot"
        type: string
      sim_device:
        description: "Simulator device"
        type: string
        default: iPhone 17
      sim_runtime:
        description: "Simulator runtime, e.g. iOS 26.3 (blank: newest installed)"
        type: string
      xcode:
        description: "Xcode"
        type: choice
        options: ["26.2"]
        default: "26.2"

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.app }}-${{ inputs.trio }}-${{ inputs.submodules }}-${{ inputs.pump }}-${{ inputs.pump_setup }}
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ !inputs.comment_on_run }}
    runs-on: [self-hosted, macOS, worker]
    timeout-minutes: 150
    env:
      # Inputs reach scripts only through env, never interpolated into them.
      IN_APP: ${{ inputs.app || 'trio' }}
      # Every harness command in the job, the agent's included, acts on this app (harness/apps.py).
      TH_APP: ${{ inputs.app || 'trio' }}
      IN_TRIO: ${{ inputs.trio }}
      IN_SUBMODULES: ${{ inputs.submodules }}
      IN_CHERRY_PICK: ${{ inputs.cherry_pick }}
      IN_SUBMODULE_CHERRY_PICK: ${{ inputs.submodule_cherry_pick }}
      IN_CONFIGURATION: ${{ inputs.configuration }}
      IN_SKIP_ONBOARDING: ${{ inputs.skip_onboarding }}
      IN_SMOKE: ${{ inputs.smoke }}
      IN_DEVICES: ${{ inputs.devices || 'phone' }}
      IN_PUMP: ${{ inputs.pump || 'simulator' }}
      IN_PUMP_SETUP: ${{ inputs.pump_setup || 'preseed' }}
      IN_PUMP_SCENARIO: ${{ inputs.pump_scenario }}
      IN_FAKETANDEM_REF: ${{ inputs.faketandem_ref }}
      IN_WATCH_MODEL: ${{ inputs.watch_model || 'default' }}
      IN_AGENT_INSTRUCTIONS: ${{ inputs.agent_instructions }}
      TH_XCODE_APP: /Applications/Xcode_${{ inputs.xcode }}.app
      TH_SIM_DEVICE: ${{ inputs.sim_device }}
      TH_SIM_RUNTIME: ${{ inputs.sim_runtime }}
      # jwoglom/Trio carries feat/tandem (the TandemKit submodule) and upstream's branches; the workers'
      # bare mirror of nightscout/Trio serves as a reference, so most objects come from local disk.
      TH_TRIO_ORIGIN: jwoglom/Trio
      TH_TRIO_REFERENCE: /Volumes/work/mirrors/nightscout/Trio.git
      # LoopKit/LoopWorkspace carries feat/tandem-closed-beta (the TandemKit submodule); a mirror is used if a worker has one.
      TH_LOOP_REFERENCE: /Volumes/work/mirrors/LoopKit/LoopWorkspace.git
      TH_GIT_MIRRORS: /Volumes/work/mirrors
      # Built by home-infra macos-workers (toolchains role), pinned to one WebDriverAgent release.
      TH_WDA_PREBUILT: /Volumes/work/cache/wda/current
    steps:
      - uses: actions/checkout@v4

      # Maps the source fields onto trio-test-e2e flags (rules in ci/inputs.py) and picks the PR
      # the run is about: the app's own PR, else the first submodule PR.
      - name: Validate inputs
        id: v
        run: python3 ci/inputs.py "$RUNNER_TEMP/e2e-args" >> "$GITHUB_OUTPUT"

      # Contents: read on jwoglom/Trio + jwoglom/TandemKit (private submodule) and PR metadata.
      - name: GitHub App token (jwoglom)
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIO_E2E_APP_ID }}
          private-key: ${{ secrets.TRIO_E2E_APP_KEY }}
          owner: jwoglom

      - name: Python environment
        run: |
          set -euo pipefail
          uv venv --quiet .venv
          uv pip install --quiet --python .venv/bin/python -r requirements.txt

      # faketandem is built from source (TH_FAKETANDEM_REF) with Go.
      - name: Set up Go
        if: inputs.pump == 'faketandem'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build, install, launch, smoke (trio-test-e2e)
        id: e2e
        env:
          TH_GIT_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # --devices auto asks a small model whether the PR needs the watch (harness/watchscope.py)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          # Per-job paths (workerd's task dir), so nothing is shared between runs.
          export TRIO_REPO="$RUNNER_TEMP/Trio" TH_DERIVED_DATA="${DERIVED_DATA:-$RUNNER_TEMP/DerivedData}"
          export LOOP_REPO="$RUNNER_TEMP/LoopWorkspace" TH_LOOP_DERIVED_DATA="${DERIVED_DATA:-$RUNNER_TEMP/DerivedData}-loop"
          args=(--mode simulator --yes --no-agent --comment never --configuration "$IN_CONFIGURATION"
                --onboarding "$([ "$IN_SKIP_ONBOARDING" = true ] && echo preseed || echo walk)")
          while IFS= read -r a; do args+=("$a"); done < "$RUNNER_TEMP/e2e-args"
          [ "$IN_SMOKE" = true ] || args+=(--no-smoke)
          # The fake CGM/pump setup steps are left out of report.html and the comment (everything else stays).
          if [ "$IN_SMOKE" = true ]; then args+=(--hide-setup-screenshots); fi
          args+=(--devices "$IN_DEVICES")
          if [ "$IN_WATCH_MODEL" != default ]; then args+=(--watch-model "$IN_WATCH_MODEL"); fi
          if [ "$IN_PUMP" = faketandem ]; then
            args+=(--pump faketandem --pump-setup "$IN_PUMP_SETUP")
            [ -z "$IN_PUMP_SCENARIO" ] || args+=(--pump-scenario "$IN_PUMP_SCENARIO")
            [ -z "$IN_FAKETANDEM_REF" ] || args+=(--faketandem-ref "$IN_FAKETANDEM_REF")
          fi
          # The runner's bash has -e; keep going so the run dir is recorded even when the run fails.
          rc=0
          ./trio-test-e2e "${args[@]}" || rc=$?
          run_dir=$(cat runs/.current 2>/dev/null || true)
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          exit $rc

      # No GitHub token here: the agent only drives the simulator through the harness.
      - name: Agent (Claude Code tests what the PR describes)
        id: agent
        if: steps.e2e.outcome == 'success'
        timeout-minutes: ${{ fromJSON(inputs.agent_minutes) }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ inputs.claude_model || 'sonnet' }}
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
        run: |
          set -euo pipefail
          if [ "$IN_APP" = loop ]; then cgm="CGM Simulator" prompt_file=ci/agent-prompt-loop.md
          else cgm="Glucose Simulator" prompt_file=ci/agent-prompt.md; fi
          pump="Pump Simulator"
          if [ "$IN_PUMP" = faketandem ]; then
            pump="Tandem pump on faketandem ($([ "$IN_PUMP_SETUP" = walk ] && echo "not set up yet: you walk its setup" || echo "already paired"); see below)"
          fi
          smoke_note=$([ "$IN_SMOKE" = true ] && echo ", with the $cgm and the $pump" || true)
          extra=$([ -n "$IN_AGENT_INSTRUCTIONS" ] && printf '\nFocus from the person who started this run:\n%s\n' "$IN_AGENT_INSTRUCTIONS" || true)
          # the faketandem pump: what it is, its commands and how this run set it up (ci/agent-faketandem*.md)
          extra="$extra$(RUN_DIR="$RUN_DIR" .venv/bin/python -c 'import os; from harness import faketandem; print(faketandem.agent_notes(os.environ["RUN_DIR"]))')"
          # whether trio-test-e2e included the watch (asked for, or decided by --devices auto)
          watch=$(RUN_DIR="$RUN_DIR" .venv/bin/python -c 'import json, os, pathlib; print(str(json.loads((pathlib.Path(os.environ["RUN_DIR"]) / "run.json").read_text()).get("watch", False)).lower())')
          if [ "$watch" = true ]; then extra="$extra"$'\n'"$(cat ci/agent-watch.md)"; fi
          prompt=$(RUN_DIR="$RUN_DIR" SMOKE="$smoke_note" EXTRA="$extra" PROMPT_FILE="$prompt_file" .venv/bin/python -c '
          import os, pathlib
          t = pathlib.Path(os.environ["PROMPT_FILE"]).read_text()
          print(t.format(run_dir=os.environ["RUN_DIR"], smoke_note=os.environ["SMOKE"], extra=os.environ["EXTRA"]))')
          # stream-json + ci/agent-stream.py: live progress in this log (model, each tool call, notes),
          # final answer into agent-summary.md for the job summary.
          # Locked down (ci/claude-sandbox.py, ci/agent-limits.md): Bash may only run the harness and sleep,
          # everything else is denied (dontAsk), and the harness commands run in macOS's sandbox with no network,
          # writes only under runs/, build/, the temp folders and the installed app's own simulator containers (`th db`),
          # and the harness daemons' Unix sockets (in /private/tmp: a socket path under this runner's checkout is over
          # macOS's 104 bytes), started here outside the sandbox because they hold the simulator and WebDriverAgent
          # connections. The venv's Python: the container lookup imports the harness.
          .venv/bin/python ci/claude-sandbox.py "$RUNNER_TEMP/claude-settings.json" sim "$IN_APP"
          ./trio-test-harness --target sim daemon start
          trap './trio-test-harness --target sim daemon stop >/dev/null 2>&1 || true' EXIT
          if [ "$watch" = true ]; then
            ./trio-test-harness --target watch daemon start
            trap './trio-test-harness --target sim daemon stop >/dev/null 2>&1; ./trio-test-harness --target watch daemon stop >/dev/null 2>&1 || true' EXIT
          fi
          # read by "Fail the job if the agent step failed": a failure before this line is the harness's, not the agent's
          echo "setup=ok" >> "$GITHUB_OUTPUT"
          claude -p "$prompt" --model "$CLAUDE_MODEL" --output-format stream-json --verbose \
            --permission-mode dontAsk --permission-prompts none --settings "$RUNNER_TEMP/claude-settings.json" \
            --append-system-prompt "$(cat ci/agent-limits.md)" \
            --allowedTools "Bash(./trio-test-harness:*)" "Bash(./bin/th:*)" "Bash(sleep:*)" Read Glob Grep \
            | python3 ci/agent-stream.py "$RUN_DIR/agent-summary.md"
          # crash reports from the agent's session into the run (trio-test-e2e saved those before it)
          ./trio-test-harness --target sim crashes --save --run "$RUN_DIR" || true
          ./trio-test-harness report html --run "$RUN_DIR" >/dev/null

      # The pump's side of the run (its state, history log, request log and log) goes into the run directory.
      - name: Stop faketandem
        if: always() && inputs.pump == 'faketandem'
        env:
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
        run: |
          if [ -n "$RUN_DIR" ]; then ./trio-test-harness faketandem stop --save --run "$RUN_DIR"
          else ./trio-test-harness faketandem stop; fi

      # A separate Claude pass, with no memory of the test session, reads the whole run (PR, steps, notes, the
      # tester's findings), looks at the screenshots and picks only the relevant ones; report.html and the PR
      # comment lead with its verdict, prose and picks (ci/highlights-prompt.md, ci/highlights.py).
      - name: Highlights (a separate Claude pass picks the relevant screenshots)
        id: highlights
        if: always() && steps.e2e.outputs.run_dir != ''
        timeout-minutes: 10
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ inputs.claude_model || 'sonnet' }}
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
        run: |
          set -euo pipefail
          extra=$([ -n "$IN_AGENT_INSTRUCTIONS" ] && printf '\nFocus from the person who started this run:\n%s\n' "$IN_AGENT_INSTRUCTIONS" || true)
          prompt=$(RUN_DIR="$RUN_DIR" EXTRA="$extra" .venv/bin/python -c '
          import os, pathlib
          t = pathlib.Path("ci/highlights-prompt.md").read_text()
          print(t.format(run_dir=os.environ["RUN_DIR"], extra=os.environ["EXTRA"]))')
          python3 ci/claude-sandbox.py "$RUNNER_TEMP/claude-settings.json"
          claude -p "$prompt" --model "$CLAUDE_MODEL" --output-format stream-json --verbose \
            --permission-mode dontAsk --permission-prompts none --settings "$RUNNER_TEMP/claude-settings.json" \
            --append-system-prompt "$(cat ci/review-limits.md)" \
            --allowedTools Read Glob Grep \
            | python3 ci/agent-stream.py "$RUN_DIR/highlights-raw.md"
          python3 ci/highlights.py "$RUN_DIR" "$RUN_DIR/highlights-raw.md"
          ./trio-test-harness report html --run "$RUN_DIR" >/dev/null

      - name: GitHub App token (PR owner)
        id: comment_token
        if: always() && inputs.post_comment && steps.v.outputs.pr != '' && steps.v.outputs.pr_owner != 'jwoglom'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIO_E2E_APP_ID }}
          private-key: ${{ secrets.TRIO_E2E_APP_KEY }}
          owner: ${{ steps.v.outputs.pr_owner }}

      - name: PR comment
        id: comment
        if: always() && inputs.post_comment && steps.e2e.outputs.run_dir != ''
        env:
          GH_TOKEN: ${{ steps.comment_token.outputs.token || (steps.v.outputs.pr_owner == 'jwoglom' && steps.token.outputs.token) || '' }}
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ steps.v.outputs.pr }}
          PR_OWNER: ${{ steps.v.outputs.pr_owner }}
          # Screenshots are uploaded with a user PAT that can only reach this repo (GitHub takes
          # attachment uploads from user tokens only); the comment is still posted as the App. The
          # images are visible to people who can read this private repo, so only PRs in jwoglom's
          # repos get them; elsewhere the comment carries captions and a link to the run.
          TH_UPLOAD_TOKEN: ${{ steps.v.outputs.pr_owner == 'jwoglom' && secrets.TRIO_TEST_HARNESS_USER_PAT || '' }}
          TH_UPLOAD_REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR" ]; then
            echo "::notice title=PR comment skipped::this run has no PR (Trio branch only)"
            echo "note=skipped: this run has no PR" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=PR comment skipped::the trio-test-harness-runner App is not installed on $PR_OWNER"
            echo "note=skipped: the trio-test-harness-runner App is not installed on $PR_OWNER" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if out=$(./trio-test-harness report pr "$PR" --run "$RUN_DIR" --artifact-url "$RUN_URL" 2>&1); then
            echo "note=posted $(echo "$out" | tail -1)" >> "$GITHUB_OUTPUT"
          else
            echo "$out" | tail -20
            echo "::warning title=PR comment failed::see the PR comment step log"
            echo "note=failed; see the PR comment step log" >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: always()
        env:
          RUN_DIR: ${{ steps.e2e.outputs.run_dir }}
          COMMENT_NOTE: ${{ steps.comment.outputs.note }}
        run: |
          args=()
          [ -z "$RUN_DIR" ] || args+=("$RUN_DIR" --agent-summary "$RUN_DIR/agent-summary.md")
          [ -z "$COMMENT_NOTE" ] || args+=(--comment-note "$COMMENT_NOTE")
          python3 ci/summary.py "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run (screenshots, steps, report)
        if: always() && steps.e2e.outputs.run_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'trio' }}-e2e-${{ github.run_id }}
          path: ${{ steps.e2e.outputs.run_dir }}
          retention-days: 14

      # report.html embeds the screenshots, so as an unzipped artifact it opens without unpacking.
      - name: Upload report.html (unzipped)
        if: always() && steps.e2e.outputs.run_dir != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.e2e.outputs.run_dir }}/report.html
          archive: false
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build log (on failure)
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'trio' }}-e2e-${{ github.run_id }}-build-log
          path: build/xcodebuild-*.log
          retention-days: 14
          if-no-files-found: ignore

      # The agent step continues on error so the highlights, report, PR comment and uploads above still run; this
      # step then fails the job, since a run whose agent step failed tested less than it reports.
      - name: Fail the job if the agent step failed
        if: always() && steps.agent.outcome == 'failure'
        env:
          SETUP: ${{ steps.agent.outputs.setup }}
        run: |
          if [ "$SETUP" = ok ]; then
            echo "::error::The agent step failed: the Claude session ended with an error or ran out of time (see its log)."
          else
            echo "::error::The agent step failed before the agent started: the harness could not set up the sandbox or its daemons (see the step's log)."
          fi
          exit 1

  comment:
    if: ${{ inputs.comment_on_run }}
    runs-on: [self-hosted, macOS, worker]
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      IN_APP: ${{ inputs.app || 'trio' }}
      IN_TRIO: ${{ inputs.trio }}
      IN_SUBMODULES: ${{ inputs.submodules }}
      IN_CHERRY_PICK: ${{ inputs.cherry_pick }}
      IN_SUBMODULE_CHERRY_PICK: ${{ inputs.submodule_cherry_pick }}
      IN_RUN_ID: ${{ inputs.comment_on_run }}
      IN_BODY: ${{ inputs.comment_body }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        id: v
        run: |
          [[ $IN_RUN_ID =~ ^[0-9]+$ ]] || { echo "::error::comment_on_run must be a workflow run id"; exit 1; }
          [ -n "$IN_BODY" ] || { echo "::error::comment_body is empty"; exit 1; }
          python3 ci/inputs.py "$RUNNER_TEMP/e2e-args" >> "$GITHUB_OUTPUT"

      - name: GitHub App token (PR owner)
        id: token
        if: steps.v.outputs.pr != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIO_E2E_APP_ID }}
          private-key: ${{ secrets.TRIO_E2E_APP_KEY }}
          owner: ${{ steps.v.outputs.pr_owner }}

      - name: Download the run
        uses: actions/download-artifact@v4
        with:
          name: trio-e2e-${{ inputs.comment_on_run }}
          run-id: ${{ inputs.comment_on_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/run

      - name: Python environment
        run: |
          set -euo pipefail
          uv venv --quiet .venv
          uv pip install --quiet --python .venv/bin/python -r requirements.txt

      - name: PR comment
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.v.outputs.pr }}
          # As for the e2e job's comment: only PRs in jwoglom's repos get the screenshots inline.
          TH_UPLOAD_TOKEN: ${{ steps.v.outputs.pr_owner == 'jwoglom' && secrets.TRIO_TEST_HARNESS_USER_PAT || '' }}
          TH_UPLOAD_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$PR" ] || { echo "::error::trio, submodules or cherry_pick must name the PR to comment on"; exit 1; }
          printf '%s\n' "$IN_BODY" > "$RUNNER_TEMP/comment.md"
          ./trio-test-harness report pr "$PR" --run "$RUNNER_TEMP/run" --body "$RUNNER_TEMP/comment.md"
